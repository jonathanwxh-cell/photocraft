name: Transform display color baseline
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          key: transform-color-focused
          cache-on-failure: true
      - name: Transform color regression on unchanged main
        run: cargo test -p photocraft-ui-egui --lib --locked transform_preview_preserves_displayed_profile_colors -- --nocapture
