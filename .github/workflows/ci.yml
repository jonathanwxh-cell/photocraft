name: Verify pen cursor orientation
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Cursor geometry and interaction tests
        run: |
          cargo test -p photocraft-ui-egui --lib brush_cursor -- --nocapture
          cargo test -p photocraft-ui-egui --lib tool_cursor -- --nocapture
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict UI Clippy
        run: cargo clippy -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Full UI crate
        run: cargo test -p photocraft-ui-egui
      - name: Layers and WASM
        run: |
          cargo xtask layers
          cargo xtask wasm
