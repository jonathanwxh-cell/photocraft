name: Font metadata baseline
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6129
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Compile test binary
        run: cargo test -p photocraft-text --lib --no-run
      - name: Require metadata preservation assertion failure on main
        run: |
          set +e
          cargo test -p photocraft-text --lib text_rebuild_preserves_imported_font_metadata -- --nocapture > /tmp/baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/baseline.log
          test "$result" -eq 101
          grep -q 'existing font metadata must survive a text edit' /tmp/baseline.log
          grep -q 'test result: FAILED' /tmp/baseline.log
