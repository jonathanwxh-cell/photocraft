name: Verify 7549 saved preview preservation
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: photocraft-owner-verification
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  PHOTOCRAFT_NO_PRINT: "1"
  LPDEST: photocraft-no-such-printer
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Full format tests including fixed regression
        run: cargo test -p photocraft-format --locked
      - name: Strict format Clippy
        run: cargo clippy -p photocraft-format --all-targets --locked -- -D warnings
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo test -p photocraft-format --locked
      - run: cargo clippy -p photocraft-format --all-targets --locked -- -D warnings
      - run: cargo xtask layers
      - run: cargo xtask wasm
