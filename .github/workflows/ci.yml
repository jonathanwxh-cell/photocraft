name: Verify 6145 platform test compatibility
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: photocraft-owner-verification
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  algo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Full algorithm crate tests including panorama regressions
        run: cargo test -p photocraft-algo --locked
      - name: Strict algorithm Clippy on all targets
        run: cargo clippy -p photocraft-algo --all-targets --locked -- -D warnings
