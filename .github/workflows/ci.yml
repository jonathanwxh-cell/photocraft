name: Verify installed working profiles
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6323
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Reproduce missing installed working profile
        shell: bash
        run: |
          export CARGO_HOME="$HOME/.cargo"
          export RUSTUP_HOME="$HOME/.rustup"
          export PHOTOCRAFT_PROFILE_TEST_HOME="$(mktemp -d)"
          export HOME="$PHOTOCRAFT_PROFILE_TEST_HOME"
          set +e
          cargo test -p photocraft-ui-egui --lib installed_working_profile_is_selectable_6323 -- --ignored --exact filter_dialog::tests::installed_working_profile_is_selectable_6323 --nocapture 2>&1 | tee baseline.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -F 'installed RGB profile must appear in working-space menu' baseline.log
          grep -F '0 passed; 1 failed' baseline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: working-profile-baseline
          path: baseline.log
          retention-days: 7
