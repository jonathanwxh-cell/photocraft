name: Verify PR6264 snapped square bounds
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: photocraft-repair
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  PHOTOCRAFT_REQUIRE_GPU_TESTS: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Require software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
      - name: Reproduce original square overflow
        run: |
          git show c6c67175:crates/ui-egui/src/canvas.rs > crates/ui-egui/src/canvas.rs
          set +e
          cargo test -p photocraft-ui-egui fixed_ratio_square_spanning_short_side_keeps_preview_and_commit_inside -- --nocapture > /tmp/square-baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/square-baseline.log
          test "$result" -ne 0
          grep -F 'short-side square escaped' /tmp/square-baseline.log
          grep -F '1 failed' /tmp/square-baseline.log
          git restore crates/ui-egui/src/canvas.rs
      - name: Fixed regression
        run: cargo test -p photocraft-ui-egui fixed_ratio_square_spanning_short_side_keeps_preview_and_commit_inside -- --nocapture
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Full UI tests
        run: cargo test -p photocraft-ui-egui
      - name: Strict Clippy
        run: cargo clippy -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Layers
        run: cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
      - name: Source integrity
        run: git diff --exit-code
