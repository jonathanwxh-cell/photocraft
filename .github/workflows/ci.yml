name: EXR Quick Export visual verification
on:
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp/photocraft-exr-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Prepare software GPU
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
      - name: Validate final command documentation and focused regression
        run: |
          cargo fmt --all -- --check
          cargo test -p photocraft-engine --lib --locked quick_export_exr_preserves_linear_hdr_and_alpha
      - name: Capture baseline preferences
        run: |
          git checkout b097800e78405aeb2068113988898f991e707eb4 -- crates/engine/src/prefs.rs crates/engine/src/web_cmds.rs crates/ui-egui/src/prefs_ui.rs crates/ui-egui/src/menus.rs
          cargo run -p photocraft-ui-egui --example snapshot -- --out before.png --size 1280x900 --scale 1 --script '[["ui.menu.invoke",{"id":"file.export.exportPreferences"}]]'
          git restore --source=HEAD -- crates/engine/src/prefs.rs crates/engine/src/web_cmds.rs crates/ui-egui/src/prefs_ui.rs crates/ui-egui/src/menus.rs
      - name: Capture EXR preferences
        run: |
          cargo run -p photocraft-ui-egui --example snapshot -- --out after.png --size 1280x900 --scale 1 --script '[["engine.execute",{"command":"prefs.set","params":{"values":{"export.quickExportFormat":"exr"}}}],["ui.menu.invoke",{"id":"file.export.exportPreferences"}]]'
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: exr-preferences-before-after
          path: |
            before.png
            after.png
          retention-days: 3


