name: Verify 7549 saved preview preservation
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: photocraft-owner-verification
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  PHOTOCRAFT_NO_PRINT: "1"
  LPDEST: photocraft-no-such-printer
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Prove regression on unchanged production source
        shell: pwsh
        run: |
          git show f3fb5781ef432aaeff42656865f9dcc9c94d17b3:crates/format/src/store.rs | Set-Content crates/format/src/store.rs
          cargo test -p photocraft-format --test roundtrip failed_manifest_commit_preserves_omitted_previews -- --exact --nocapture 2>&1 | Tee-Object baseline.log
          $code=$LASTEXITCODE
          $log=Get-Content baseline.log -Raw
          git checkout 9c927993b5c114879040bf9bda0bdc0325341dbd -- crates/format/src/store.rs
          if($code -eq 0 -or $log -notmatch 'saved file lost after failed commit: thumb.png' -or $log -notmatch '1 failed'){throw 'Expected behavioral regression was not established'}
          exit 0
      - name: Full format tests including fixed regression
        run: cargo test -p photocraft-format --locked
      - name: Strict format Clippy
        run: cargo clippy -p photocraft-format --all-targets --locked -- -D warnings
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo test -p photocraft-format --locked
      - run: cargo clippy -p photocraft-format --all-targets --locked -- -D warnings
      - run: cargo xtask layers
      - run: cargo xtask wasm
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus
          save-if: false
      - uses: actions/cache/restore@v4
        with:
          path: corpus/
          key: corpus-${{ hashFiles('xtask/src/corpus_pins.rs', 'xtask/*.sha256') }}
      - run: cargo xtask test-corpus

