name: Fixed-ratio marquee baseline
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6192
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Require inside control and intended outside-origin ratio failure
        run: |
          set +e
          cargo test -p photocraft-ui-egui --lib fixed_ratio_marquee_started_outside_canvas_keeps_ratio -- --nocapture > /tmp/baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/baseline.log
          test "$result" -eq 101
          grep -q 'outside-origin fixed-ratio marquee lost its ratio' /tmp/baseline.log
          grep -q 'test result: FAILED' /tmp/baseline.log
