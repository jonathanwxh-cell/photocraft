name: Selection visibility verification
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-5597
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Install and verify software graphics adapter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p selection-evidence
          vulkaninfo --summary > selection-evidence/adapter.log 2>&1
          cat selection-evidence/adapter.log
          grep -qi llvmpipe selection-evidence/adapter.log
      - name: Fixed regression and full affected crate tests
        run: cargo test -p photocraft-ui-egui
      - name: Strict all-target Clippy
        run: cargo clippy -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Formatting and dependency layers
        run: |
          cargo fmt --all -- --check
          cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
      - name: Render selection visibility states
        run: |
          cargo build -p photocraft-ui-egui --example snapshot
          python3 .github/scripts/verify-5597-render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-visibility-evidence
          path: selection-evidence/
          retention-days: 7
          if-no-files-found: ignore
