name: Verify PR6519 fallible zoomed blend
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: photocraft-repair
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  PHOTOCRAFT_REQUIRE_GPU_TESTS: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Require software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Liquify regressions
        run: cargo test -p photocraft-ui-egui liquify_ui -- --nocapture
      - name: Full UI tests
        run: cargo test -p photocraft-ui-egui
      - name: Strict Clippy
        run: cargo clippy -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Dependency layers
        run: cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
      - name: Source integrity
        run: git diff --exit-code
