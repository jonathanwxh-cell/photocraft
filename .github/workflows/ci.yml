name: 6123 isolated spot channel baseline
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6123
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux UI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Existing alpha-channel convention control
        run: cargo test -p photocraft-ui-egui --lib solo_alpha_keeps_white_coverage_when_spot_metadata_is_removed -- --nocapture
      - name: Expected isolated spot-view regression on unchanged main code
        run: |
          set +e
          cargo test -p photocraft-ui-egui --lib solo_spot_channel_reads_full_ink_as_black -- --nocapture > /tmp/6123-baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/6123-baseline.log
          test "$result" -eq 101
          grep -q 'full ink must be dark' /tmp/6123-baseline.log
          grep -q 'test result: FAILED' /tmp/6123-baseline.log
