name: New selection visibility baseline
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-5597
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Existing Extras control
        run: cargo test -p photocraft-ui-egui --lib show_snap_extras_and_screen_modes_are_state -- --nocapture
      - name: Require intended selection visibility failure
        run: |
          set +e
          cargo test -p photocraft-ui-egui --lib creating_a_selection_restores_hidden_extras -- --nocapture > /tmp/baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/baseline.log
          test "$result" -eq 101
          grep -q 'new selections stayed hidden after Extras was disabled' /tmp/baseline.log
          grep -q 'test result: FAILED' /tmp/baseline.log
