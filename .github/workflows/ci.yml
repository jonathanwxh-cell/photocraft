name: CSH import candidate
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          key: csh-import-focused
          cache-on-failure: true
      - name: Engine CSH import regressions
        env:
          PHOTOCRAFT_CSH_FIXTURE: /tmp/photocraft-original-triangle.csh
        run: cargo test -p photocraft-engine --test csh_import --locked -- --nocapture
      - name: Bounded CSH parser regressions
        run: cargo test -p photocraft-psd --test csh --locked -- --nocapture
      - name: Preset file UI routing
        run: cargo test -p photocraft-ui-egui --lib --locked preset_files_ui -- --nocapture
      - name: Independent original-fixture reader
        if: always()
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix /tmp/csh-oracle ag-psd@14.3.2
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert/strict');
          const { readCsh } = require('/tmp/csh-oracle/node_modules/ag-psd/dist/csh.js');
          const result = readCsh(fs.readFileSync('/tmp/photocraft-original-triangle.csh'));
          assert.equal(result.shapes.length, 1);
          const shape = result.shapes[0];
          assert.equal(shape.name, 'Triangle');
          assert.equal(shape.width, 200);
          assert.equal(shape.height, 100);
          assert.equal(shape.paths.length, 1);
          assert.equal(shape.paths[0].knots.length, 3);
          console.log(JSON.stringify(result));
          JS
