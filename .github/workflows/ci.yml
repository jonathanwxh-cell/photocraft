name: Repair visual and native evidence
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '5545'
            os: ubuntu-latest
            sha: 31916eb9b0df9a6a43fc7c326426f31fd0e6b140
            test: transform_profile_visual_evidence
          - pr: '5493'
            os: ubuntu-latest
            sha: 906dc9ea9415e1fad7d5e1624649c3863eb0f093
            test: csh_panel_import_visual_evidence
          - pr: '5587'
            os: windows-latest
            sha: e338761de9f72a3a83fe9c4d8cd1812b27166358
            test: busy_native_clipboard_preserves_copied_shape
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Render existing visual regressions
        if: runner.os == 'Linux'
        env:
          XDG_RUNTIME_DIR: /tmp
          PHOTOCRAFT_TRANSFORM_EVIDENCE: /tmp/repair-evidence
          PHOTOCRAFT_CSH_EVIDENCE: /tmp/repair-evidence
        run: cargo test -p photocraft-ui-egui --lib --locked ${{ matrix.test }} -- --ignored --nocapture
      - name: Real Windows clipboard contention
        if: runner.os == 'Windows'
        run: cargo test -p photocraft --bin photocraft --locked services::tests::busy_native_clipboard_preserves_copied_shape -- --ignored --exact --test-threads=1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && success()
        with:
          name: repair-${{ matrix.pr }}-visuals
          path: /tmp/repair-evidence/*.png
          if-no-files-found: error
          retention-days: 3
