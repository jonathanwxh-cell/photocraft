name: Verify clipboard CI conflict repair
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-5587-repair
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate repaired workflow
        run: |
          git show HEAD^:.github/workflows/ci.yml > /tmp/repaired-ci.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= /tmp/repaired-ci.yml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Clipboard regression tests
        run: cargo test -p photocraft-ui-egui --locked --lib 'clipboard_tests::'
      - name: Native clipboard service tests
        run: cargo test -p photocraft --locked --bin photocraft services::tests::
