name: Probe Zoom tool wheel drift
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Actual canvas wheel matrix
        run: cargo test -p photocraft-ui-egui --lib zoom_tool_vertical_wheel_drift_probe_6371 -- --nocapture
