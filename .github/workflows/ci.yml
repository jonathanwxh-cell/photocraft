name: Selection visibility verification
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-5597
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Selection-tool baseline must fail on unchanged production code
        run: |
          cp crates/ui-egui/src/lib.rs /tmp/fixed-lib.rs
          git show 4e7a17cd5d5723313f459753663d0d155f047e19:crates/ui-egui/src/lib.rs > crates/ui-egui/src/lib.rs
          set +e
          cargo test -p photocraft-ui-egui --lib creating_a_selection_restores_hidden_extras -- --nocapture > /tmp/pointer-baseline.log 2>&1
          result=$?
          set -e
          cp /tmp/fixed-lib.rs crates/ui-egui/src/lib.rs
          cat /tmp/pointer-baseline.log
          test "$result" -eq 101
          grep -q 'new selections stayed hidden after Extras was disabled' /tmp/pointer-baseline.log
          grep -q 'test result: FAILED' /tmp/pointer-baseline.log
      - name: Fixed regression and full affected crate tests
        run: cargo test -p photocraft-ui-egui
      - name: Strict all-target Clippy
        run: cargo clippy -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Formatting and dependency layers
        run: |
          cargo fmt --all -- --check
          cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
      - name: Render selection visibility states
        env:
          XDG_RUNTIME_DIR: /tmp
          WGPU_BACKEND: vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          cargo build -p photocraft-ui-egui --example snapshot
          python3 .github/scripts/verify-5597-render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-visibility-evidence
          path: selection-evidence/
          retention-days: 7
          if-no-files-found: ignore
