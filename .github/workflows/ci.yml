name: Blend render region measurement
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_BUILD_JOBS: '2'
  RAYON_NUM_THREADS: '4'
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Machine and compiler
        run: |
          rustc -Vv
          lscpu
          free -h
      - name: Measure CPU composition regions
        run: |
          cargo test --release -p photocraft-compose --test blend_render_measurement --locked -- --ignored --nocapture --test-threads=1
