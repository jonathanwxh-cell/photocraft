name: 4980 browser packaging and interaction verification
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-4980
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-web
          save-if: false
      - name: Reproduce unchanged dependency lint on baseline
        run: |
          git worktree add --detach /tmp/photocraft-4980-base df055f3dcb0bb0312af97548ee6c6f9628f21dd7
          set +e
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo clippy --manifest-path /tmp/photocraft-4980-base/Cargo.toml -p photocraft-web --target wasm32-unknown-unknown -- -D warnings > /tmp/4980-baseline-clippy.log 2>&1
          result=$?
          set -e
          cat /tmp/4980-baseline-clippy.log
          test "$result" -ne 0
          grep -q 'drop_non_drop\|drop-non-drop' /tmp/4980-baseline-clippy.log
          grep -q 'crates/format/src/store.rs:552' /tmp/4980-baseline-clippy.log
      - name: Strict browser shell Clippy without unchanged dependency lints
        run: cargo clippy --no-deps -p photocraft-web --target wasm32-unknown-unknown -- -D warnings
      - name: Install pinned trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Browser release and packaging gates
        run: packaging/web/package.sh
      - name: Browser test tooling, cloud only
        run: |
          mkdir -p /tmp/qa-node
          cd /tmp/qa-node
          npm init -y
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actual browser picker and drop controls
        env:
          NODE_PATH: /tmp/qa-node/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/web >/tmp/web-server.log 2>&1 &
          node .github/4980-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4980-browser-evidence
          path: qa-evidence/
          retention-days: 7
          if-no-files-found: ignore
