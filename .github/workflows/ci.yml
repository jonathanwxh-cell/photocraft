name: Cineon independent padding oracle
on: workflow_dispatch
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install OpenImageIO==3.1.18.1
      - run: sudo apt-get update -qq && sudo apt-get install -y imagemagick
      - run: convert -version
      - run: python .github/cineon_oracle.py

