name: Measure Liquify selection resources
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  PHOTOCRAFT_REQUIRE_GPU_TESTS: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare runner and preserve probe outside checkout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools time
          mkdir -p "$XDG_RUNTIME_DIR" /tmp/liquify-resource
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
          cp .github/5989-resource-probe.rs /tmp/liquify-resource/probe.rs
          cp .github/5989-run-resource-probe.py /tmp/liquify-resource/run.py
          git rev-parse HEAD > /tmp/liquify-resource/verification-sha.txt
          rustc -Vv > /tmp/liquify-resource/toolchain.txt
          lscpu > /tmp/liquify-resource/cpu.txt
      - name: Baseline measurements
        run: |
          git fetch --depth=1 origin 6368e6a851da8836a1f0ac978d171b7d0a7643d6
          git checkout --detach 6368e6a851da8836a1f0ac978d171b7d0a7643d6
          git rev-parse HEAD > /tmp/liquify-resource/baseline-sha.txt
          python3 /tmp/liquify-resource/run.py baseline /tmp/liquify-resource/probe.rs /tmp/liquify-resource/results
      - name: Candidate measurements
        run: |
          git checkout --detach "$(cat /tmp/liquify-resource/verification-sha.txt)"
          git rev-parse HEAD > /tmp/liquify-resource/candidate-sha.txt
          python3 /tmp/liquify-resource/run.py candidate /tmp/liquify-resource/probe.rs /tmp/liquify-resource/results
      - name: Required hot-path performance check
        run: cargo xtask perf --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquify-resource-measurements
          path: |
            /tmp/liquify-resource
            target/perf/*.json
            target/perf/*.md
          retention-days: 1
