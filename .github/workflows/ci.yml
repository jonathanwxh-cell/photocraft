name: Reproduce Liquify selection preview
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Require specific preview mismatch
        shell: bash
        run: |
          set +e
          cargo test -p photocraft-ui-egui --lib selection_preview_matches_unchanged_commit_5989 -- --nocapture > /tmp/probe.log 2>&1
          result=$?
          cat /tmp/probe.log
          test "$result" -ne 0 || exit 1
          grep -F 'Liquify preview changes unselected pixels although commit preserves them' /tmp/probe.log || exit 1
          grep -F '0 passed; 1 failed' /tmp/probe.log || exit 1
