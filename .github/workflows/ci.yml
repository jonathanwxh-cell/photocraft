name: Verify PR6169 linear font metadata
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: photocraft-repair
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Original release timing
        run: |
          git show e3190535:crates/text/src/psd.rs > crates/text/src/psd.rs
          cargo test --release -p photocraft-text font_metadata_large_lists_timing -- --ignored --nocapture | tee /tmp/font-before.log
          git restore crates/text/src/psd.rs
      - name: Fixed release timing
        run: cargo test --release -p photocraft-text font_metadata_large_lists_timing -- --ignored --nocapture | tee /tmp/font-after.log
      - name: Require improvement on both adversarial lists
        run: |
          python3 - <<'PY'
          import re
          def timings(path):
              return {kind: float(t) for kind, t in re.findall(r'FONT_LOOKUP reordered=(false|true) n=100000 median_seconds=([0-9.]+)', open(path).read())}
          before, after = timings('/tmp/font-before.log'), timings('/tmp/font-after.log')
          assert set(before) == set(after) == {'false', 'true'}
          for kind in before:
              print(f'reordered={kind}: before={before[kind]:.6f}s after={after[kind]:.6f}s speedup={before[kind]/after[kind]:.2f}x')
              assert after[kind] < before[kind] / 3, 'expected at least 3x improvement'
          PY
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Text tests
        run: cargo test -p photocraft-text
      - name: Strict Clippy
        run: cargo clippy -p photocraft-text --all-targets -- -D warnings
      - name: Dependency layers
        run: cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
      - name: Source integrity
        run: git diff --exit-code
