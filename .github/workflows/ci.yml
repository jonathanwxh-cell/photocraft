name: Verify Liquify selection repair
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  PHOTOCRAFT_REQUIRE_GPU_TESTS: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
      - name: Candidate formatting
        run: |
          rustfmt --edition 2024 crates/algo/src/liquify.rs crates/ui-egui/src/liquify_ui.rs
          git diff -- crates/algo/src/liquify.rs crates/ui-egui/src/liquify_ui.rs > /tmp/5989-format.patch
          cargo fmt --all -- --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formatting-patch
          path: /tmp/5989-format.patch
          retention-days: 1
      - name: Focused regressions
        run: |
          cargo test -p photocraft-algo --lib liquify::tests -- --nocapture
          cargo test -p photocraft-ui-egui --lib liquify_ui::tests -- --nocapture
      - name: Strict Clippy
        run: cargo clippy -p photocraft-algo -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Affected crate tests
        run: cargo test -p photocraft-algo -p photocraft-ui-egui -p photocraft-engine
      - name: Dependency layers
        run: cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
      - name: Visual receipts
        run: python3 .github/5989-visual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-receipts
          path: /tmp/5989-visual/*.png
          retention-days: 1
