name: Blend viewport baseline
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          key: menu-place-focused
          cache-on-failure: true
      - name: Reproduce offscreen blend preview redraw
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          cargo test -p photocraft-ui-egui --lib --locked blend_hover_refresh_is_limited_to_visible_canvas -- --nocapture --test-threads=1
