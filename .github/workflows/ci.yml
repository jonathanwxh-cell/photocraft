name: 4980 admission verification
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-4980
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Exact baseline picker loop, six bytes only
        run: python3 .github/4980-baseline.py
      - name: Admission tests without UI dependencies
        run: |
          rustc --edition=2024 --test apps/photocraft-web/src/file_ingest.rs -o /tmp/admission-tests
          /tmp/admission-tests --nocapture
      - name: Linux UI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Affected crate tests
        run: cargo test -p photocraft-web -p photocraft-ui-egui
      - name: Strict Clippy
        run: cargo clippy -p photocraft-web -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Layers
        run: cargo xtask layers
      - name: L0 to L6 wasm gate
        run: cargo xtask wasm
      - name: Browser adapters and shell Clippy
        run: cargo clippy -p photocraft-web --target wasm32-unknown-unknown -- -D warnings
