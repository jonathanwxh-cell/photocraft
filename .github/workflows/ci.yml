name: Reproduce PSD smart-filter import gap
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6267
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_SMART_FILTER_FIXTURE: /tmp/smart-filters.psd
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Fetch pinned public PSD fixture
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/Agamnentzar/ag-psd/387049670cb89b88fb8fe1b7c01aeacf98dd2e3b/test/read-write/smart-filters/src.psd -o "$PHOTOCRAFT_SMART_FILTER_FIXTURE"
          echo "c4a91d3d4a2667bc317b83e3ec2e9650e6d53d3101110482da8ba0468e6bcb8f  $PHOTOCRAFT_SMART_FILTER_FIXTURE" | sha256sum --check
      - name: Require intended unsupported-filter failure
        run: |
          set +e
          cargo test -p photocraft-io --test smart_filter_import_6267 -- --ignored --nocapture > /tmp/baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/baseline.log
          test "$result" -eq 101
          grep -q 'reported smart filter remains unsupported: filter.sharpen.sharpen' /tmp/baseline.log
          grep -q 'test result: FAILED' /tmp/baseline.log
