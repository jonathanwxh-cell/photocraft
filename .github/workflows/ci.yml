name: Verify PR5413 pattern and multi-view coverage
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-5413
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  PHOTOCRAFT_REQUIRE_GPU_TESTS: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Require software Vulkan adapter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
      - name: Reproduce both regressions on original PR source with new tests
        shell: bash
        run: |
          git show f22d08da:crates/ui-egui/src/blend_preview.rs > crates/ui-egui/src/blend_preview.rs
          git show f22d08da:crates/ui-egui/src/canvas.rs > crates/ui-egui/src/canvas.rs
          set +e
          cargo test -p photocraft-ui-egui blend_hover_pattern_tiles_and_multiple_views_reuse_current_pixels -- --nocapture > /tmp/pattern-baseline.log 2>&1
          pattern_result=$?
          cargo test -p photocraft-ui-egui blend_hover_disjoint_coverage_retains_views_without_hiding_gaps -- --nocapture > /tmp/views-baseline.log 2>&1
          views_result=$?
          set -e
          cat /tmp/pattern-baseline.log /tmp/views-baseline.log
          test "$pattern_result" -ne 0
          test "$views_result" -ne 0
          grep -F 'preview differs at (0,200)' /tmp/pattern-baseline.log
          grep -F '1 failed' /tmp/pattern-baseline.log
          grep -F 'assertion `left == right` failed' /tmp/views-baseline.log
          grep -F '1 failed' /tmp/views-baseline.log
          git restore crates/ui-egui/src/blend_preview.rs crates/ui-egui/src/canvas.rs
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Fixed targeted GPU regressions
        run: cargo test -p photocraft-ui-egui blend_hover -- --nocapture
      - name: Full affected UI tests
        run: cargo test -p photocraft-ui-egui
      - name: Strict Clippy
        run: cargo clippy -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Dependency layers
        run: cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
      - name: Confirm tested source unchanged
        run: git diff --exit-code
