name: Font metadata verification
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6129
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Text tests including metadata regressions
        run: cargo test -p photocraft-text
      - name: Strict all-target text Clippy
        run: cargo clippy -p photocraft-text --all-targets -- -D warnings
      - name: Dependency layers
        run: cargo xtask layers
      - name: L0-L6 WASM
        run: cargo xtask wasm
