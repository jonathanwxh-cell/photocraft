name: Investigate resize visibility persistence
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6257
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Software Vulkan adapter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
      - name: Resize hide show baseline
        run: cargo test -p photocraft-ui-egui --lib resized_placed_layer_keeps_geometry_after_visibility_toggle -- --nocapture
