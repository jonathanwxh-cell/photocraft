name: Verify PSD Sharpen and Dust smart filters
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6267
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_SMART_FILTER_FIXTURE: /tmp/smart-filters.psd
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Fetch pinned public PSD fixture
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/Agamnentzar/ag-psd/387049670cb89b88fb8fe1b7c01aeacf98dd2e3b/test/read-write/smart-filters/src.psd -o "$PHOTOCRAFT_SMART_FILTER_FIXTURE"
          echo "c4a91d3d4a2667bc317b83e3ec2e9650e6d53d3101110482da8ba0468e6bcb8f  $PHOTOCRAFT_SMART_FILTER_FIXTURE" | sha256sum --check
      - name: Imported real PSD filters
        run: cargo test -p photocraft-io --test smart_filter_import_6267 -- --ignored --nocapture
      - name: Import settings and preservation regressions
        run: cargo test -p photocraft-io --lib smart_map::tests -- --nocapture
      - name: Replacement rerenders with imported filters
        run: cargo test -p photocraft-engine --test imported_smart_filters -- --nocapture
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy -p photocraft-io -p photocraft-engine --all-targets -- -D warnings
      - name: Full affected crates
        run: cargo test -p photocraft-io -p photocraft-engine
      - name: Dependency layers
        run: cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
  corpus:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Repository corpus verification
        run: cargo xtask test-corpus
