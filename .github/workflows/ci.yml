name: 4980 browser packaging and interaction verification
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-4980
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Updated admission tests
        run: |
          rustc --edition=2024 --test apps/photocraft-web/src/file_ingest.rs -o /tmp/admission-tests
          /tmp/admission-tests --nocapture
      - name: Linux UI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy -p photocraft-web -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Layers
        run: cargo xtask layers
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-web
          save-if: false
      - name: L0 to L6 wasm gate
        run: cargo xtask wasm
      - name: Browser adapters and shell Clippy
        run: cargo clippy -p photocraft-web --target wasm32-unknown-unknown -- -D warnings
      - name: Install pinned trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Browser release and packaging gates
        run: packaging/web/package.sh
      - name: Browser test tooling, cloud only
        run: |
          mkdir -p /tmp/qa-node
          cd /tmp/qa-node
          npm init -y
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actual browser picker and drop controls
        env:
          NODE_PATH: /tmp/qa-node/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/web >/tmp/web-server.log 2>&1 &
          node .github/4980-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4980-browser-evidence
          path: qa-evidence/
          retention-days: 7
          if-no-files-found: ignore
