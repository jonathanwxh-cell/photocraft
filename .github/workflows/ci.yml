name: Verify 6145 upstream integration October 18
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: photocraft-owner-verification
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser-locale
          save-if: false
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Strict browser-path Clippy excluding known unchanged dependency lint
        run: cargo clippy --no-deps -p photocraft-web --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Layering
        run: cargo xtask layers
      - name: Complete L0-L6 WASM gate
        run: cargo xtask wasm
