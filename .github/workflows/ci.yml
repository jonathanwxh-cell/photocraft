name: Verify pen cursor with software graphics
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  PHOTOCRAFT_REQUIRE_GPU_TESTS: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Require software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
      - name: Cursor tests and actual bitmap exports
        env:
          PHOTOCRAFT_CURSOR_OUTPUT: /tmp/pen-cursors
        run: |
          cargo test -p photocraft-ui-egui --lib brush_cursor -- --nocapture
          cargo test -p photocraft-ui-egui --lib tool_cursor -- --nocapture
      - name: Formatting and strict UI Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Full UI crate
        run: cargo test -p photocraft-ui-egui
      - name: Layers and WASM
        run: |
          cargo xtask layers
          cargo xtask wasm
      - name: Release cursor generation timing
        run: cargo test --release -p photocraft-ui-egui --lib pen_cursor_cost_probe -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pen-cursor-images
          path: /tmp/pen-cursors/*.png
          if-no-files-found: error
          retention-days: 7
