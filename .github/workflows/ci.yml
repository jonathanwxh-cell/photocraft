name: Autosave retry synchronization verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          key: autosave-retry-focused
          cache-on-failure: true
      - name: Application tests
        run: cargo test -p photocraft --bin photocraft --locked
      - name: Repeat retry regression
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 30; $iteration++) {
            cargo test -p photocraft --bin photocraft --locked -- --exact services::tests::failed_background_autosave_is_reported_and_retried_without_another_edit
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Application lint
        run: cargo clippy -p photocraft --all-targets --locked -- -D warnings
      - name: Layers
        run: cargo xtask layers
