name: Native clipboard contention focused verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: autosave-retry-windows
          cache-on-failure: true
      - name: Native clipboard contention
        run: cargo test -p photocraft --bin photocraft --locked busy_native_clipboard_preserves_copied_shape -- --ignored --nocapture --test-threads=1
      - name: Clipboard UI regressions
        run: cargo test -p photocraft-ui-egui --lib --locked clipboard -- --nocapture
      - name: Formatting
        run: cargo fmt --all -- --check
