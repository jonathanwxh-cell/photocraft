name: Verify PR5413 Windows failure
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-5413
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Confirm engine source unchanged by repair
        run: git diff --exit-code f22d08da 49d48fc4 -- crates/engine crates/testkit
      - name: Repeat the failed panic harness check
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            cargo test -p photocraft-engine --test panic_hunt contained_panics_count_and_graceful_errors_do_not -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Engine integration tests
        run: cargo test -p photocraft-engine --tests
      - name: Confirm tested source unchanged
        run: git diff --exit-code
