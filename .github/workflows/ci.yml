name: PSD shape transparency baseline
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6180
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Existing editable shape roundtrip control
        run: cargo test -p photocraft-io --test vector shape_layer_typed_roundtrip -- --nocapture
      - name: Require intended transparency regression
        run: |
          set +e
          cargo test -p photocraft-io --test vector psd_shape_solid_alpha_survives_reopen_and_rerender -- --nocapture > /tmp/baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/baseline.log
          test "$result" -eq 101
          grep -q 'solid shape alpha changed after PSD reopen and fresh rendering' /tmp/baseline.log
          grep -q 'test result: FAILED' /tmp/baseline.log
