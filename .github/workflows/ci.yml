name: Verify fixed-ratio marquee bounds
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6192
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
  XDG_RUNTIME_DIR: /tmp/photocraft-runtime
  WGPU_BACKEND: vulkan
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Software Vulkan adapter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
      - name: Pointer regression
        run: cargo test -p photocraft-ui-egui --lib fixed_ratio_marquee_started_outside_canvas_keeps_ratio -- --nocapture
      - name: Full UI crate
        run: cargo test -p photocraft-ui-egui
      - name: Strict Clippy
        run: cargo clippy -p photocraft-ui-egui --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Dependency layers
        run: cargo xtask layers
      - name: WASM
        run: cargo xtask wasm
      - name: Render preview and committed geometry
        run: python3 .github/scripts/verify-6192-render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marquee-bounds-evidence
          path: marquee-evidence/
          retention-days: 7
          if-no-files-found: ignore
