name: Verify pen cursor baseline
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Reproduce cursor orientation mismatch
        shell: bash
        run: |
          set +e
          cargo test -p photocraft-ui-egui --lib brush_cursor_follows_pen_orientation_6350 -- --nocapture > /tmp/cursor-baseline.log 2>&1
          result=$?
          cat /tmp/cursor-baseline.log
          test "$result" -ne 0 || exit 1
          grep -q 'cursor must follow pen orientation: penTilt' /tmp/cursor-baseline.log || exit 1
          grep -q '0 passed; 1 failed' /tmp/cursor-baseline.log || exit 1
