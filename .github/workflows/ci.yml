name: Verify useful CSH documentation
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: photocraft-owner-verification
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Render changed public and private API documentation
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc -p photocraft-psd -p photocraft-engine --no-deps --document-private-items --locked
