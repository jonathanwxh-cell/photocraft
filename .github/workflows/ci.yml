name: Relative canvas reproduction
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6078
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Existing sizing interaction control
        run: cargo test -p photocraft-ui-egui --lib sizing_dialogs_open_on_width_selected -- --nocapture
      - name: Relative canvas pointer and keyboard reproduction
        run: cargo test -p photocraft-ui-egui --lib relative_canvas_checkbox_then_typing_changes_canvas_by_delta -- --nocapture
