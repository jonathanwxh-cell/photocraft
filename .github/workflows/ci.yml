name: Verify Liquify selection previews
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Format candidate and preserve patch
        run: |
          rustfmt --edition 2024 crates/algo/src/liquify.rs crates/ui-egui/src/liquify_ui.rs
          git diff -- crates/algo/src/liquify.rs crates/ui-egui/src/liquify_ui.rs > /tmp/5989-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: /tmp/5989-format.patch
          retention-days: 1
      - name: Algorithm Liquify tests
        run: cargo test -p photocraft-algo --lib liquify::tests -- --nocapture
      - name: UI Liquify tests
        run: cargo test -p photocraft-ui-egui --lib liquify_ui::tests -- --nocapture
