name: Verify 6169 conflict repair
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: verify-6169-conflict
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  PHOTOCRAFT_NO_PRINT: "1"
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus
          save-if: false
      - uses: actions/cache/restore@v4
        with:
          path: corpus/
          key: corpus-${{ hashFiles('xtask/src/corpus_pins.rs', 'xtask/*.sha256') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Text crate tests including merged regressions
        run: cargo test -p photocraft-text --locked
      - name: Preset loader regressions
        run: cargo test -p photocraft-engine --lib --locked presets
      - name: Export preset round trip
        run: cargo test -p photocraft-engine --lib --locked export_preset_cmds
      - name: Strict engine Clippy
        run: cargo clippy -p photocraft-engine --all-targets --locked -- -D warnings
      - name: Strict text Clippy
        run: cargo clippy -p photocraft-text --all-targets --locked -- -D warnings
      - name: Layer boundaries
        run: cargo xtask layers
      - name: L0-L6 WASM
        run: cargo xtask wasm
      - name: Full pinned corpus gate
        run: cargo xtask test-corpus
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: text-6169
          save-if: false
      - name: Windows text tests
        run: cargo test -p photocraft-text --locked
