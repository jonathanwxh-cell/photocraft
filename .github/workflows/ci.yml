name: Blend required quick performance check
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_BUILD_JOBS: '2'
  RAYON_NUM_THREADS: '4'
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2ed5cdcb7e53586fdf5ad9e44abc0dee64cd285
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - name: Verify source and required performance command
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          git rev-parse HEAD
          rustc -Vv
          cargo xtask perf --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blend-required-perf-report
          path: perf/results/
          if-no-files-found: warn
