name: Transform display 24MP release benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          key: transform-color-focused
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: UI lint
        run: cargo clippy -p photocraft-ui-egui --all-targets --locked -- -D warnings
      - name: Release 24MP profile preparation
        run: cargo test --release -p photocraft-ui-egui --lib --locked transform_profile_upload_cost -- --ignored --nocapture
