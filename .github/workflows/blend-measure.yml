name: Blend canvas release measurement
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_BUILD_JOBS: '2'
  RAYON_NUM_THREADS: '4'
  PHOTOCRAFT_NO_PRINT: '1'
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - name: Machine and compiler
        run: |
          rustc -Vv
          lscpu
          free -h
      - name: Measure actual canvas CPU fallback
        env:
          XDG_RUNTIME_DIR: /tmp
        run: cargo test --release -p photocraft-ui-egui --lib --locked blend_viewport_release_measurement -- --ignored --nocapture --test-threads=1
